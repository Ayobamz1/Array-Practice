<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <style>
      #display {
        font-size: 2rem;
        font-weight: 900;
        text-shadow: 2px 2px 20px #0000007c;
        color: rgba(1, 37, 199, 0.568);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="col-11 col-sm-10 col-md-8 col-lg-5 mx-auto mt-5 shadow p-3 p-md-5">
      <h2
        class="text-center text-decoration-underline py-2 text-success fs-2 fw-bold"
      >
        Mini Shopping Cart
      </h2>
      <input
        type="text"
        placeholder="Enter Your Item(s) Here"
        id="input"
        class="form-control form-control-sm"
      />
      <div id="display"></div>
      <div class="d-flex flex-column flex-sm-row gap-2 mt-4 w-100">
<button onclick="addItem()" class="btn btn-success flex-fill">
  Add Item
</button>

<button onclick="deleteItem()" class="btn btn-dark flex-fill">
  Delete Item
</button>

<button onclick="deleteAll()" class="btn btn-danger flex-fill">
  Delete All
</button>
      </div>
    </div>
    <div id="displayArea" class="text-center mt-4">
      Your Item(s) will show here
    </div>

    <script src="shopping.js"></script>
  </body>
</html>
