<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link
      rel="stylesheet"
      href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <style>
      #display {
        font-size: 1.5rem;
        font-weight: 700;
        text-shadow: 2px 2px 10px #000;
        color: rgb(151, 124, 3);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="col-9 col-lg-5 col-md-6 mx-auto mt-5 shadow p-5">
      <h2
        class="text-center text-decoration-underline py-2 text-success fs-2 fw-bold"
      >
        Mini Shopping Cart
      </h2>
      <input
        type="text"
        placeholder="Enter Your Item(s) Here"
        id="input"
        class="form-control form-control-sm"
      />
      <div id="display"></div>
      <div class="col-9 col-lg-9 d-flex gap-3 mt-4 w-100">
        <button onclick="addItem()" class="btn btn-success px-5 flex-fill">
          Add Item
        </button>
        <button onclick="deleteItem()" class="btn btn-dark px-5 flex-fill">
          Delete Item
        </button>
        <button onclick="deleteAll()" class="btn btn-danger px-5 flex-fill">
          Delete All
        </button>
      </div>
    </div>
    <div id="displayArea" class="text-center mt-4">
      Your Item(s) will show here
    </div>

    <script src="shopping.js"></script>
  </body>
</html>
